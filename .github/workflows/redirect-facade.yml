name: publish documentation redirect facade

on:
  workflow_call:
    inputs:
      website_sha:
        description: Exact website commit already deployed at the organization root.
        required: false
        default: ""
        type: string
      canonical_route:
        description: Stable canonical documentation route for provenance v2.
        required: false
        default: ""
        type: string
      profile_route:
        description: Stable ecosystem profile route for provenance v2.
        required: false
        default: ""
        type: string
      migration_website_sha:
        description: Optional fixed root snapshot used once to preserve aliases during v2 migration.
        required: false
        default: ""
        type: string
      repository:
        description: Calling beyond10x repository name.
        required: true
        type: string
      control_sha:
        description: Exact bot-authored caller commit on main.
        required: true
        type: string

permissions: {}

concurrency:
  group: pages-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.actor == 'b10x-bot[bot]' && github.triggering_actor == 'b10x-bot[bot]' && github.repository == format('beyond10x/{0}', inputs.repository) && github.ref == 'refs/heads/main' && github.sha == inputs.control_sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate immutable inputs
        id: mode
        env:
          CANONICAL_ROUTE: ${{ inputs.canonical_route }}
          WEBSITE_SHA: ${{ inputs.website_sha }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          MIGRATION_WEBSITE_SHA: ${{ inputs.migration_website_sha }}
          PROFILE_ROUTE: ${{ inputs.profile_route }}
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          RUNTIME_REPOSITORY: ${{ job.workflow_repository }}
          RUNTIME_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          for revision in "$CONTROL_SHA" "$RUNTIME_SHA"; do
            case "$revision" in *[!0-9a-f]*|'') exit 1 ;; esac
            test "${#revision}" -eq 40
            test "$revision" != 0000000000000000000000000000000000000000
          done
          if test -n "$WEBSITE_SHA"; then
            test -z "$CANONICAL_ROUTE" && test -z "$PROFILE_ROUTE" && test -z "$MIGRATION_WEBSITE_SHA"
            mode=v1
          else
            test -n "$CANONICAL_ROUTE" && test -n "$PROFILE_ROUTE"
            mode=v2
          fi
          for revision in "$WEBSITE_SHA" "$MIGRATION_WEBSITE_SHA"; do
            test -z "$revision" && continue
            case "$revision" in *[!0-9a-f]*|'') exit 1 ;; esac
            test "${#revision}" -eq 40
            test "$revision" != 0000000000000000000000000000000000000000
          done
          test "$CONTROL_SHA" = "$GITHUB_SHA"
          test "$RUNTIME_REPOSITORY" = beyond10x/website
          test "$GITHUB_REPOSITORY" = "beyond10x/$SOURCE_REPOSITORY"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
      - name: Check out the immutable façade runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .runtime
          persist-credentials: false
      - name: Check out caller controls as immutable data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.control_sha }}
          path: .control-data
          persist-credentials: false
      - name: Check out the fixed Website data revision when required
        if: inputs.website_sha != '' || inputs.migration_website_sha != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: beyond10x/website
          ref: ${{ inputs.website_sha || inputs.migration_website_sha }}
          path: .website-data
          fetch-depth: 0
          persist-credentials: false
      - name: Verify caller, runtime, and optional Website data authority
        env:
          BOT_EMAIL: 316511680+b10x-bot[bot]@users.noreply.github.com
          BOT_LOGIN: b10x-bot[bot]
          CONTROL_SHA: ${{ inputs.control_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          RUNTIME_SHA: ${{ job.workflow_sha }}
          DATA_SHA: ${{ inputs.website_sha || inputs.migration_website_sha }}
        run: |
          set -euo pipefail
          test "$(git -C .runtime rev-parse HEAD)" = "$RUNTIME_SHA"
          test "$(git -C .control-data rev-parse HEAD)" = "$CONTROL_SHA"
          if test -n "$DATA_SHA"; then
            test "$(git -C .website-data rev-parse HEAD)" = "$DATA_SHA"
          fi
          test "$(git ls-remote --refs "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk 'NF == 2 { print $1 }')" = "$CONTROL_SHA"

          assert_git_authority_identity() {
            local repository=$1 revision=$2
            mapfile -t identity < <(git -C "$repository" show -s --format='%an%n%ae%n%cn%n%ce' "$revision")
            test "${#identity[@]}" -eq 4
            test "${identity[0]}" = "$BOT_LOGIN" && test "${identity[1]}" = "$BOT_EMAIL"
            if test "${identity[2]}" = "$BOT_LOGIN" && test "${identity[3]}" = "$BOT_EMAIL"; then
              return
            fi
            test "${identity[2]}" = GitHub && test "${identity[3]}" = 'noreply@github.com'
          }
          # Parent topology is deliberately absent: depth-one checkouts hide it, and the
          # App-only caller ref plus the API identity below are the durable authority.
          assert_git_authority_identity .runtime "$RUNTIME_SHA"
          assert_git_authority_identity .control-data "$CONTROL_SHA"
          if test -n "$DATA_SHA"; then
            assert_git_authority_identity .website-data "$DATA_SHA"
          fi

          mkdir -p "$RUNNER_TEMP/b10x-facade-boundary"
          api_commit() {
            local repository=$1 revision=$2 destination=$3
            curl --fail-with-body --silent --show-error --location --retry 3 \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$repository/commits/$revision" > "$destination"
          }
          api_commit beyond10x/website "$RUNTIME_SHA" "$RUNNER_TEMP/b10x-facade-boundary/runtime.json"
          api_commit "$GITHUB_REPOSITORY" "$CONTROL_SHA" "$RUNNER_TEMP/b10x-facade-boundary/control.json"
          if test -n "$DATA_SHA"; then
            api_commit beyond10x/website "$DATA_SHA" "$RUNNER_TEMP/b10x-facade-boundary/website.json"
          fi
          assert_api_authority() {
            local document=$1 revision=$2
            jq -e --arg login "$BOT_LOGIN" \
              --arg revision "$revision" \
              '.sha == $revision and .author.login == $login and (
                .committer.login == $login or (
                  .committer.login == "web-flow" and
                  .commit.verification.verified == true and
                  .commit.verification.reason == "valid"
                )
              )' "$document" >/dev/null
          }
          assert_api_authority "$RUNNER_TEMP/b10x-facade-boundary/runtime.json" "$RUNTIME_SHA"
          assert_api_authority "$RUNNER_TEMP/b10x-facade-boundary/control.json" "$CONTROL_SHA"
          if test -n "$DATA_SHA"; then
            assert_api_authority "$RUNNER_TEMP/b10x-facade-boundary/website.json" "$DATA_SHA"
          fi

          git -C .runtime fetch --quiet --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          git -C .runtime merge-base --is-ancestor "$RUNTIME_SHA" refs/remotes/origin/main
          if test -n "$DATA_SHA"; then
            git -C .website-data fetch --quiet --no-tags origin \
              '+refs/heads/main:refs/remotes/origin/main'
            git -C .website-data merge-base --is-ancestor "$DATA_SHA" refs/remotes/origin/main
          fi
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .runtime/package-lock.json
      - name: Install the pinned façade generator
        working-directory: .runtime
        run: npm ci --ignore-scripts
      - name: Build legacy or stable compatibility routes
        working-directory: .runtime
        env:
          CANONICAL_ROUTE: ${{ inputs.canonical_route }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          MIGRATION_WEBSITE_SHA: ${{ inputs.migration_website_sha }}
          PROFILE_ROUTE: ${{ inputs.profile_route }}
          REPOSITORY: ${{ inputs.repository }}
          RUNTIME_SHA: ${{ job.workflow_sha }}
          WEBSITE_SHA: ${{ inputs.website_sha }}
        run: |
          set -euo pipefail
          if test '${{ steps.mode.outputs.mode }}' = v1; then
            node scripts/build-redirect-facade.mjs \
              --repository "$REPOSITORY" \
              --website-sha "$WEBSITE_SHA" \
              --data ../.website-data \
              --out ../_site
          else
            arguments=(
              --repository "$REPOSITORY"
              --canonical-route "$CANONICAL_ROUTE"
              --profile-route "$PROFILE_ROUTE"
              --runtime-sha "$RUNTIME_SHA"
              --control-sha "$CONTROL_SHA"
              --out ../_site
            )
            if test -n "$MIGRATION_WEBSITE_SHA"; then
              arguments+=(--migration-website-sha "$MIGRATION_WEBSITE_SHA" --data ../.website-data)
            fi
            node scripts/build-redirect-facade.mjs "${arguments[@]}"
          fi
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
