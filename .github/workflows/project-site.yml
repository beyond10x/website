# Publish one source repository's own documentation site to its project Pages.
#
# The redirect façade beside this file answers `/<repository>/` with a redirect to the unified
# site. This workflow is the other answer: the repository's own Docusaurus build, served at the
# same path, with the landing page, the interactive pages and the curated sidebar the unified
# render cannot carry. A repository uses one or the other, never both, because GitHub serves one
# Pages deployment per repository.
#
# Source repositories are public and hold no App credentials, so the build and the deployment are
# separated the way the documentation bundle already separates them. The caller repository builds
# its site in its own credential-free workflow and uploads it as an ordinary artifact; this
# workflow runs in the caller's context with `pages: write`, downloads that exact artifact from
# that exact run, and deploys it. It never executes source-repository code.
name: publish project documentation site

on:
  workflow_call:
    inputs:
      repository:
        description: Calling beyond10x repository name.
        required: true
        type: string
      control_sha:
        description: Exact bot-authored caller commit on main.
        required: true
        type: string
      build_workflow:
        description: File name of the caller's credential-free site build workflow.
        required: true
        type: string
      artifact:
        description: Artifact name the caller's site build uploads.
        required: false
        default: b10x-project-site
        type: string
      route_base:
        description: Path the deployed site is served under, with both slashes.
        required: true
        type: string

permissions: {}

concurrency:
  group: pages-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.actor == 'b10x-bot[bot]' && github.triggering_actor == 'b10x-bot[bot]' && github.repository == format('beyond10x/{0}', inputs.repository) && github.ref == 'refs/heads/main' && github.sha == inputs.control_sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate immutable inputs
        env:
          CONTROL_SHA: ${{ inputs.control_sha }}
          BUILD_WORKFLOW: ${{ inputs.build_workflow }}
          ROUTE_BASE: ${{ inputs.route_base }}
          ARTIFACT: ${{ inputs.artifact }}
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          RUNTIME_REPOSITORY: ${{ job.workflow_repository }}
          RUNTIME_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          for revision in "$CONTROL_SHA" "$RUNTIME_SHA"; do
            case "$revision" in *[!0-9a-f]*|'') exit 1 ;; esac
            test "${#revision}" -eq 40
            test "$revision" != 0000000000000000000000000000000000000000
          done
          case "$BUILD_WORKFLOW" in *[!a-z0-9.-]*|'') exit 1 ;; esac
          case "$BUILD_WORKFLOW" in *.yml) ;; *) exit 1 ;; esac
          case "$ARTIFACT" in *[!a-z0-9-]*|'') exit 1 ;; esac
          test "$ROUTE_BASE" = "/$SOURCE_REPOSITORY/"
          test "$CONTROL_SHA" = "$GITHUB_SHA"
          test "$RUNTIME_REPOSITORY" = beyond10x/website
          test "$GITHUB_REPOSITORY" = "beyond10x/$SOURCE_REPOSITORY"
      - name: Check out caller controls as immutable data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.control_sha }}
          path: .control-data
          persist-credentials: false
      - name: Verify caller authority
        env:
          BOT_EMAIL: 316511680+b10x-bot[bot]@users.noreply.github.com
          BOT_LOGIN: b10x-bot[bot]
          CONTROL_SHA: ${{ inputs.control_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C .control-data rev-parse HEAD)" = "$CONTROL_SHA"
          test "$(git ls-remote --refs "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk 'NF == 2 { print $1 }')" = "$CONTROL_SHA"

          mapfile -t identity < <(git -C .control-data show -s --format='%an%n%ae%n%cn%n%ce' "$CONTROL_SHA")
          test "${#identity[@]}" -eq 4
          test "${identity[0]}" = "$BOT_LOGIN" && test "${identity[1]}" = "$BOT_EMAIL"
          if ! { test "${identity[2]}" = "$BOT_LOGIN" && test "${identity[3]}" = "$BOT_EMAIL"; }; then
            test "${identity[2]}" = GitHub && test "${identity[3]}" = 'noreply@github.com'
          fi

          mkdir -p "$RUNNER_TEMP/b10x-site-boundary"
          curl --fail-with-body --silent --show-error --location --retry 3 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$CONTROL_SHA" \
            > "$RUNNER_TEMP/b10x-site-boundary/control.json"
          jq -e --arg login "$BOT_LOGIN" --arg revision "$CONTROL_SHA" \
            '.sha == $revision and .author.login == $login and (
              .committer.login == $login or (
                .committer.login == "web-flow" and
                .commit.verification.verified == true and
                .commit.verification.reason == "valid"
              )
            )' "$RUNNER_TEMP/b10x-site-boundary/control.json" >/dev/null
      - name: Resolve the build run that holds the artifact
        id: build
        env:
          BUILD_WORKFLOW: ${{ inputs.build_workflow }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The artifact is only as trustworthy as the run that made it, so the run is selected by
          # the exact commit this caller is publishing rather than supplied at dispatch: that
          # commit, on `main`, from a push, completed and green. A run of another workflow, or of a
          # pull request, can hold a tree nobody merged.
          curl --fail-with-body --silent --show-error --location --retry 3 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$BUILD_WORKFLOW/runs?head_sha=$CONTROL_SHA&branch=main&event=push&status=success&per_page=100" \
            > "$RUNNER_TEMP/b10x-site-boundary/runs.json"
          run_id="$(jq -r --arg revision "$CONTROL_SHA" '
            [.workflow_runs[]
              | select(.head_sha == $revision
                and .head_branch == "main"
                and .event == "push"
                and .status == "completed"
                and .conclusion == "success")]
            | sort_by(.run_started_at) | last | .id // empty' \
            "$RUNNER_TEMP/b10x-site-boundary/runs.json")"
          test -n "$run_id"
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
      - name: Download the built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: _site
      - name: Verify what the artifact says it is
        env:
          CONTROL_SHA: ${{ inputs.control_sha }}
          ROUTE_BASE: ${{ inputs.route_base }}
          SOURCE_REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          # A site built for the wrong base path deploys without error and answers 404 for every
          # asset, so the build declares the path it was built for and this refuses a mismatch
          # before anything is published.
          manifest=_site/.well-known/b10x-site.json
          test -f "$manifest"
          jq -e --arg repository "$SOURCE_REPOSITORY" \
            --arg revision "$CONTROL_SHA" \
            --arg base "$ROUTE_BASE" \
            '.schema == "b10x-project-site/v1"
              and .repository == $repository
              and .commit == $revision
              and .baseUrl == $base' "$manifest" >/dev/null
          test -f _site/index.html
          test ! -e _site/.git
      - name: Write the delivery provenance this site is verified against
        env:
          CONTROL_SHA: ${{ inputs.control_sha }}
          ROUTE_BASE: ${{ inputs.route_base }}
          RUNTIME_SHA: ${{ job.workflow_sha }}
          SOURCE_REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          # `atlas docs verify` reads this document for every project Pages delivery. A façade's
          # provenance binds the root Website commit it redirects to; this one binds the commit the
          # site was built from and the publisher that deployed it, and names no root, because a
          # project site does not move when the root republishes.
          manifest=_site/.well-known/b10x-docs.json
          rm -f "$manifest"
          inventory="$RUNNER_TEMP/b10x-site-boundary/inventory"
          (cd _site && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$inventory"
          artifact_sha256="$(sha256sum "$inventory" | awk '{print $1}')"
          mkdir -p _site/.well-known
          jq -n --arg repository "$SOURCE_REPOSITORY" \
            --arg base "$ROUTE_BASE" \
            --arg runtime "$RUNTIME_SHA" \
            --arg control "$CONTROL_SHA" \
            --arg artifact "$artifact_sha256" \
            '{schema: "b10x-site-provenance/v1",
              repository: $repository,
              deliveryRole: "project-site",
              routeBase: $base,
              runtimeCommit: $runtime,
              controlCommit: $control,
              artifactSha256: $artifact}' > "$manifest"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
