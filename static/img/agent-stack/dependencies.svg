<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1172" viewBox="0 0 1560 1172" role="img" aria-labelledby="t2 d2">
<title id="t2">How a request travels through the beyond10x agent stack</title>
<desc id="d2">From the operator through takt and Loom, then either straight to llm for Loom's own decisions or through metaharness to harness, Claude Code or Codex, down to the model providers.</desc>
