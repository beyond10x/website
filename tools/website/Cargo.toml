[package]
name = "website-tools"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
url = "2"
percent-encoding = "2"

uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
tempfile = "3"
serde_yaml = "0.9"
libc = "0.2"
